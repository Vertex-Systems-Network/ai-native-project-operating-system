name: ANPOS Vendor Commercial Launch Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-launch-integrity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout vendor source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned ANPOS validation dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Compile vendor launch scripts/tests
        run: python -m compileall -q scripts tests

      - name: Run commercial launch package tests
        run: python -m unittest tests.test_commercial_launch_package -v

      - name: Validate commercial launch package
        run: python scripts/validate_commercial_launch_package.py

      - name: Run protected-base commercial launch validator when available
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}:scripts/validate_commercial_launch_package.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/validate_commercial_launch_package.py" > scripts/.trusted-base-commercial-launch-validator.py
            python scripts/.trusted-base-commercial-launch-validator.py
            rm -f scripts/.trusted-base-commercial-launch-validator.py
          else
            echo 'Base predates commercial launch package validator; current validator plus protected review remain required.'
          fi
