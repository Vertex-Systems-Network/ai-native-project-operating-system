name: ANPOS Community Production Deploy (temporary)

on:
  push:
    branches:
      - ops/deploy-community-aaa9c387

permissions:
  contents: read

concurrency:
  group: anpos-community-production-deploy-temp
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_iCcbZCZb9Swe59vWrh9iaddM
      VERCEL_PROJECT_ID: prj_zsV5QWRGFAe7TP7wBzrkWcSDcG0w
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ANPOS_MARKETPLACE_APP_PRIVATE_KEY: ${{ secrets.ANPOS_MARKETPLACE_APP_PRIVATE_KEY }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Vercel credential availability
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN secret is not configured for this repository" >&2
            exit 2
          fi

      - name: Normalize and validate Marketplace App private key without exposing it
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { createPrivateKey } = require('node:crypto');
          const raw = (process.env.ANPOS_MARKETPLACE_APP_PRIVATE_KEY || '').trim();
          if (!raw) throw new Error('ANPOS_MARKETPLACE_APP_PRIVATE_KEY secret is missing');

          const candidates = [];
          const add = (label, value) => {
            if (typeof value !== 'string' || !value.trim()) return;
            const normalized = value.trim().replace(/\\n/g, '\n').replace(/\r\n/g, '\n');
            if (!candidates.some((c) => c.value === normalized)) candidates.push({ label, value: normalized });
          };
          const wrapPem = (label, body, type) => {
            const compact = body.replace(/\s+/g, '');
            if (!/^[A-Za-z0-9+/]+={0,2}$/.test(compact) || compact.length < 200) return;
            const lines = compact.match(/.{1,64}/g) || [];
            add(label, `-----BEGIN ${type}-----\n${lines.join('\n')}\n-----END ${type}-----`);
          };

          add('raw', raw);
          try {
            const parsed = JSON.parse(raw);
            if (typeof parsed === 'string') add('json-string', parsed);
          } catch {}
          try { add('base64-decoded-text', Buffer.from(raw, 'base64').toString('utf8')); } catch {}
          try { add('url-decoded', decodeURIComponent(raw)); } catch {}
          wrapPem('base64-body-pkcs8', raw, 'PRIVATE KEY');
          wrapPem('base64-body-pkcs1', raw, 'RSA PRIVATE KEY');

          let selected = null;
          let selectedLabel = null;
          for (const candidate of candidates) {
            try {
              const key = createPrivateKey(candidate.value);
              if (key.asymmetricKeyType === 'rsa') {
                selected = candidate.value.endsWith('\n') ? candidate.value : candidate.value + '\n';
                selectedLabel = candidate.label;
                break;
              }
            } catch {}
          }
          if (!selected) {
            const traits = {
              length: raw.length,
              containsPemBegin: raw.includes('BEGIN'),
              containsPrivateKeyWords: raw.includes('PRIVATE KEY'),
              looksJsonString: raw.startsWith('"') && raw.endsWith('"'),
              looksBase64: /^[A-Za-z0-9+/=\r\n]+$/.test(raw) && raw.length > 200,
            };
            console.error('Marketplace key normalization failed; safe traits:', JSON.stringify(traits));
            process.exit(3);
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/anpos-marketplace-key.pem', selected, { mode: 0o600 });
          console.log('Marketplace App private key validation: OK via ' + selectedLabel);
          NODE

      - name: Update Vercel production Marketplace private key
        shell: bash
        run: |
          npx --yes vercel@59.11.7 env update ANPOS_MARKETPLACE_APP_PRIVATE_KEY production --yes --token "$VERCEL_TOKEN" < "$RUNNER_TEMP/anpos-marketplace-key.pem"

      - name: Stage certified service outside Git metadata
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/anpos-commercial-service"
          mkdir -p "$RUNNER_TEMP/anpos-commercial-service"
          cp -a commercial-service/. "$RUNNER_TEMP/anpos-commercial-service/"

      - name: Deploy certified commercial service to production
        shell: bash
        run: |
          cd "$RUNNER_TEMP/anpos-commercial-service"
          npx --yes vercel@59.11.7 deploy --prod --yes --token "$VERCEL_TOKEN"
