name: ANPOS Community Webhook Smoke (temporary)

on:
  push:
    branches:
      - ops/deploy-community-aaa9c387

permissions:
  contents: read

concurrency:
  group: anpos-community-webhook-smoke-temp
  cancel-in-progress: true

jobs:
  webhook-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ANPOS_GITHUB_WEBHOOK_SECRET: ${{ secrets.ANPOS_GITHUB_WEBHOOK_SECRET }}
      WEBHOOK_URL: https://anpos-commercial-service.vercel.app/api/webhooks/github/marketplace
    steps:
      - name: Verify webhook secret availability
        shell: bash
        run: |
          if [ -z "${ANPOS_GITHUB_WEBHOOK_SECRET:-}" ]; then
            echo "ANPOS_GITHUB_WEBHOOK_SECRET is not configured" >&2
            exit 2
          fi

      - name: Verify signed Marketplace webhook paths without persistence
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import uuid
          import urllib.error
          import urllib.request

          secret = os.environ["ANPOS_GITHUB_WEBHOOK_SECRET"].encode()
          url = os.environ["WEBHOOK_URL"]

          def post(payload: bytes, event: str, signature: str | None = None):
              delivery = f"anpos-smoke-{uuid.uuid4()}"
              if signature is None:
                  signature = "sha256=" + hmac.new(secret, payload, hashlib.sha256).hexdigest()
              req = urllib.request.Request(
                  url,
                  data=payload,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "X-GitHub-Delivery": delivery,
                      "X-GitHub-Event": event,
                      "X-Hub-Signature-256": signature,
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return response.status, response.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode("utf-8")

          tests = []

          payload = b'{"zen":"anpos-community-webhook-smoke"}'
          status, body = post(payload, "ping")
          tests.append(("signed_ping", status, body, 200, lambda x: x.get("ok") is True and x.get("ignored") is True))

          status, body = post(payload, "ping", "sha256=" + "0" * 64)
          tests.append(("invalid_signature", status, body, 401, lambda x: x.get("error") == "invalid_webhook"))

          payload = b'{"action":"smoke","marketplace_purchase":{"account":{"id":1}}}'
          status, body = post(payload, "marketplace_purchase")
          tests.append(("unsupported_marketplace_action", status, body, 200, lambda x: x.get("ok") is True and x.get("ignored") is True))

          payload = b'{not-json'
          status, body = post(payload, "marketplace_purchase")
          tests.append(("signed_invalid_json", status, body, 400, lambda x: x.get("error") == "invalid_json"))

          payload = b'{"action":"purchased","marketplace_purchase":{"account":{}}}'
          status, body = post(payload, "marketplace_purchase")
          tests.append(("missing_account_id", status, body, 422, lambda x: x.get("error") == "missing_account_id"))

          failed = False
          for name, status, body, expected_status, predicate in tests:
              try:
                  parsed = json.loads(body)
              except Exception:
                  parsed = {}
              ok = status == expected_status and predicate(parsed)
              print(f"{name}: status={status} result={'PASS' if ok else 'FAIL'}")
              if not ok:
                  failed = True
                  print(f"  response={body[:500]}")

          if failed:
              raise SystemExit(3)
          print("ANPOS Community webhook smoke: PASS")
          PY
