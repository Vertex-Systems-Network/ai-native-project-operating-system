name: Certify Commercial Runtime 0.2.1

on:
  push:
    branches:
      - cert/anpos-commercial-hardening-131

permissions:
  contents: write

jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Use pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Pin npm and regenerate lock metadata
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1 --ignore-scripts
          test "$(npm --version)" = "11.19.1"
          node -e "if (!process.version.startsWith('v22.')) process.exit(1)"
          cd commercial-service
          npm install --package-lock-only --ignore-scripts

      - name: Verify strict reviewed install-script policy
        shell: bash
        run: |
          set -euo pipefail
          cd commercial-service
          rm -rf node_modules
          npm ci
          npm audit --audit-level=moderate
          cp package.json /tmp/anpos-commercial-package.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); delete p.allowScripts; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"
          rm -rf node_modules
          if npm ci >/tmp/anpos-unapproved-install.log 2>&1; then
            cat /tmp/anpos-unapproved-install.log
            echo 'ERROR: strict-allow-scripts did not reject an unreviewed install script.' >&2
            exit 1
          fi
          echo 'Expected fail-closed rejection observed without allowScripts approval.'
          tail -n 30 /tmp/anpos-unapproved-install.log || true
          mv /tmp/anpos-commercial-package.json package.json
          rm -rf node_modules
          npm ci

      - name: Run commercial TypeScript tests and production build
        shell: bash
        run: |
          set -euo pipefail
          cd commercial-service
          npm run typecheck
          npm run test:unit
          npm run build

      - name: Purge local runtime artifacts and temporary certification workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf commercial-service/node_modules commercial-service/.next
          git restore commercial-service/tsconfig.json
          git rm .github/workflows/cert-commercial-021.yml

      - name: Run ANPOS and commercial validators
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-anpos.txt
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validate_ai_native_repo.py
          python scripts/validate_commercial_licensing.py
          python scripts/validate_commercial_service.py

      - name: Commit certified lockfile and workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add commercial-service/package-lock.json
          changed="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'.github/workflows/cert-commercial-021.yml\ncommercial-service/package-lock.json'
          git config user.name 'ANPOS Certification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Finalize commercial runtime 0.2.1 hardening'
          git push origin HEAD:cert/anpos-commercial-hardening-131
