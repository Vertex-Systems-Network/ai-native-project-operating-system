name: ANPOS 0.3.4 Verified Vercel Preview

on:
  push:
    branches:
      - ops/vercel-preview-034

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0d6cf94388be7f097c906d527f1f7d023f113d21
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact promoted source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0d6cf94388be7f097c906d527f1f7d023f113d21"
          test "$(git rev-parse 'HEAD^{tree}')" = "8c941247413ae1bcdad189567e16f8f1b619cb50"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Export and verify exact vendor service artifact
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/anpos-vendor-preview"
          rm -rf "$root"
          python scripts/export_vendor_repositories.py --output "$root"
          python scripts/verify_vendor_handoff.py \
            --repository "$root/anpos-commercial-service" \
            --expected-mode service \
            --expected-source-revision 0d6cf94388be7f097c906d527f1f7d023f113d21 \
            --expected-source-tree 8c941247413ae1bcdad189567e16f8f1b619cb50 \
            --expected-service-version 0.3.4 \
            --expected-protocol-version 1.3.11 \
            --expected-runtime-contract split-github-app-v1 \
            > "$RUNNER_TEMP/service-preview-verification-receipt.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['RUNNER_TEMP']) / 'service-preview-verification-receipt.json').read_text())
          assert receipt['ok'] is True
          assert receipt['verification'] == 'exact_deterministic_vendor_export'
          assert receipt['artifact_identity'] == {
              'service': 'anpos-commercial-service',
              'service_version': '0.3.4',
              'source_protocol_version': '1.3.11',
              'runtime_contract': 'split-github-app-v1',
          }
          PY

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Assert deployment credential is available
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN is not configured in GitHub Actions secrets'; exit 2; }

      - name: Install pinned Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@59.10.0
          vercel --version

      - name: Link verified export to existing Vercel project
        shell: bash
        run: |
          set -euo pipefail
          service="$RUNNER_TEMP/anpos-vendor-preview/anpos-commercial-service"
          mkdir -p "$service/.vercel"
          cat > "$service/.vercel/project.json" <<'JSON'
          {"orgId":"team_iCcbZCZb9Swe59vWrh9iaddM","projectId":"prj_zsV5QWRGFAe7TP7wBzrkWcSDcG0w"}
          JSON

      - name: Deploy verified artifact to preview only
        shell: bash
        run: |
          set -euo pipefail
          service="$RUNNER_TEMP/anpos-vendor-preview/anpos-commercial-service"
          cd "$service"
          url="$(vercel deploy --yes --token="$VERCEL_TOKEN")"
          url="$(printf '%s\n' "$url" | tail -n 1 | tr -d '\r')"
          case "$url" in
            https://*.vercel.app) ;;
            *) echo "Unexpected deployment URL output: $url"; exit 3 ;;
          esac
          printf '%s\n' "$url" > "$RUNNER_TEMP/vercel-preview-url.txt"
          printf '%s\n' "source_revision=0d6cf94388be7f097c906d527f1f7d023f113d21" > "$RUNNER_TEMP/vercel-preview-receipt.txt"
          printf '%s\n' "source_tree=8c941247413ae1bcdad189567e16f8f1b619cb50" >> "$RUNNER_TEMP/vercel-preview-receipt.txt"
          printf '%s\n' "service_version=0.3.4" >> "$RUNNER_TEMP/vercel-preview-receipt.txt"
          printf '%s\n' "protocol_version=1.3.11" >> "$RUNNER_TEMP/vercel-preview-receipt.txt"
          printf '%s\n' "runtime_contract=split-github-app-v1" >> "$RUNNER_TEMP/vercel-preview-receipt.txt"
          printf '%s\n' "deployment_url=$url" >> "$RUNNER_TEMP/vercel-preview-receipt.txt"
          echo "Preview deployment: $url"

      - name: Upload non-secret preview receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anpos-vercel-preview-0.3.4
          path: |
            ${{ runner.temp }}/service-preview-verification-receipt.json
            ${{ runner.temp }}/vercel-preview-url.txt
            ${{ runner.temp }}/vercel-preview-receipt.txt
          if-no-files-found: error
          retention-days: 1
