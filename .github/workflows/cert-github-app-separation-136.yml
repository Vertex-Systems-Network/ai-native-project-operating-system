name: ANPOS 1.3.6 GitHub App Separation Certification

on:
  push:
    branches:
      - cert/github-app-separation-136

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply pending ANPOS 1.3.6 bookkeeping
        id: bookkeeping
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/apply_protocol_136.py ]; then
            python scripts/apply_protocol_136.py
            git diff --check
            git config user.name 'ANPOS Protocol Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add -A
            git commit -m 'Finalize ANPOS 1.3.6 GitHub App separation bookkeeping'
            git push origin HEAD:cert/github-app-separation-136
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install validation dependency
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Compile Python sources and tests
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: python -m compileall -q scripts tests

      - name: Hide temporary certification workflow from source-inert checks
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: rm .github/workflows/cert-github-app-separation-136.yml

      - name: Run all Python unit and conformance tests
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run source commercial vendor and Marketplace validators
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: |
          set -euo pipefail
          python scripts/validate_ai_native_repo.py
          python scripts/validate_commercial_licensing.py
          python scripts/validate_commercial_service.py
          python scripts/validate_vendor_repository_export.py
          python scripts/validate_commercial_launch_package.py
          python scripts/validate_marketplace_staged_launch.py

      - name: Verify ANPOS 1.3.6 and commercial 0.3.0 bookkeeping
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = json.loads(Path('config/protocol/version.json').read_text())
          instance = json.loads(Path('config/protocol/instance.json').read_text())
          migrations = json.loads(Path('config/protocol/migrations.json').read_text())
          package = json.loads(Path('commercial-service/package.json').read_text())
          lock = json.loads(Path('commercial-service/package-lock.json').read_text())
          catalog = json.loads(Path('config/licensing/product-catalog.json').read_text())
          checklist = json.loads(Path('blueprints/commercial/production-launch-checklist.json').read_text())
          legacy = json.loads(Path('blueprints/commercial/github-app-manifest.example.json').read_text())
          marketplace = json.loads(Path('blueprints/commercial/github-marketplace-app-manifest.example.json').read_text())
          vendor = json.loads(Path('blueprints/commercial/github-vendor-app-manifest.example.json').read_text())
          env_example = Path('commercial-service/.env.example').read_text()

          assert version['version'] == '1.3.6'
          assert version['last_protocol_migration'] == 'ANPOS-1.3.5-to-1.3.6'
          assert instance['source_protocol_version'] == '1.3.6'
          assert migrations['current_protocol_version'] == '1.3.6'
          assert any(item.get('id') == 'ANPOS-1.3.5-to-1.3.6' for item in migrations['applied_migrations'])
          assert migrations['migration_record_template']['id'] == 'ANPOS-1.3.6-to-NEXT'
          assert package['version'] == '0.3.0'
          assert lock['version'] == '0.3.0'
          assert lock['packages']['']['version'] == '0.3.0'
          assert [plan['id'] for plan in catalog['plans']] == ['developer', 'pro', 'team', 'enterprise']
          assert checklist['schema_version'] == 2
          assert checklist['launch_authorized'] is False
          assert legacy['status'] == 'deprecated_do_not_use_for_production'
          assert marketplace['required_defaults']['public'] is True
          assert vendor['required_defaults']['public'] is False
          assert 'GITHUB_MARKETPLACE_APP_ID=' in env_example
          assert 'GITHUB_VENDOR_APP_ID=' in env_example
          assert '\nGITHUB_APP_ID=' not in env_example
          assert '\nGITHUB_APP_PRIVATE_KEY=' not in env_example
          assert not Path('scripts/apply_protocol_136.py').exists()
          PY

      - name: Restore temporary workflow and verify clean tree before export
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: |
          git checkout -- .github/workflows/cert-github-app-separation-136.yml
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Verify deterministic vendor exports and split App boundary
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/export-a" "$RUNNER_TEMP/export-b"
          python scripts/export_vendor_repositories.py --output "$RUNNER_TEMP/export-a"
          python scripts/export_vendor_repositories.py --output "$RUNNER_TEMP/export-b"
          diff -qr "$RUNNER_TEMP/export-a/anpos-commercial-service" "$RUNNER_TEMP/export-b/anpos-commercial-service"
          diff -qr "$RUNNER_TEMP/export-a/anpos-commercial-template" "$RUNNER_TEMP/export-b/anpos-commercial-template"
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'export-a'
          template = root / 'anpos-commercial-template'
          service = root / 'anpos-commercial-service'
          policy = json.loads(Path('config/licensing/vendor-source-boundary.json').read_text())
          for relative in policy['vendor_only_paths']:
              assert not (template / relative).exists(), relative
          for relative in (
              'blueprints/commercial/github-app-manifest.example.json',
              'blueprints/commercial/github-marketplace-app-manifest.example.json',
              'blueprints/commercial/github-vendor-app-manifest.example.json',
              'blueprints/commercial/marketplace-staged-launch.json',
              'scripts/validate_marketplace_staged_launch.py',
              'tests/test_marketplace_staged_launch.py',
          ):
              assert not (template / relative).exists(), relative
          manifest = json.loads((template / 'EXPORT-MANIFEST.json').read_text())
          assert manifest['source_scope'] == 'canonical-minus-vendor-only-paths'
          origins = {str(item['origin']) for item in manifest['files']}
          for relative in policy['vendor_only_paths']:
              assert relative not in origins
              assert not any(origin.startswith(relative.rstrip('/') + '/') for origin in origins)
          package = json.loads((service / 'package.json').read_text())
          assert package['version'] == '0.3.0'
          PY

      - name: Set up Node 22
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: commercial-service/package-lock.json

      - name: Pin npm 11.19.1 and install locked dependencies
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        working-directory: commercial-service
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1 --ignore-scripts
          test "$(npm --version)" = "11.19.1"
          node -e "if (!process.version.startsWith('v22.')) process.exit(1)"
          npm ci
          npm audit --audit-level=low

      - name: Certify commercial service
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        working-directory: commercial-service
        run: npm run certify

      - name: Restore expected Next build mutations and verify tracked tree clean
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev '^(commercial-service/tsconfig.json|commercial-service/next-env.d.ts)$' || true)"
          test -z "$unexpected"
          git checkout -- commercial-service/tsconfig.json commercial-service/next-env.d.ts
          test -z "$(git status --porcelain --untracked-files=no)"
