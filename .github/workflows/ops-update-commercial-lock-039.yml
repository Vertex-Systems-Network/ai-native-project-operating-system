name: Update commercial 0.3.9 lockfile

on:
  push:
    branches:
      - commercial/pro-premium-distribution

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: commercial/pro-premium-distribution
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Pin npm 11.19.1 and update lock metadata
        working-directory: commercial-service
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1 --ignore-scripts
          test "$(npm --version)" = "11.19.1"
          node -e "const p=require('./package.json'); if(p.version!=='0.3.9') process.exit(1)"
          npm install --package-lock-only --ignore-scripts
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(l.version!==p.version || l.packages[''].version!==p.version) process.exit(1)"

      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- commercial-service/package-lock.json; then
            echo 'package-lock already synchronized'
            exit 0
          fi
          unexpected="$(git diff --name-only | grep -v '^commercial-service/package-lock.json$' || true)"
          test -z "$unexpected"
          git config user.name 'ANPOS Operations'
          git config user.email 'actions@users.noreply.github.com'
          git add commercial-service/package-lock.json
          git commit -m 'Sync commercial 0.3.9 package lock'
          git push origin HEAD:commercial/pro-premium-distribution
