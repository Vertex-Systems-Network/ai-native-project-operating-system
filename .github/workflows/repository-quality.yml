name: AI Native Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-native-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile validator
        run: python -m compileall -q scripts

      - name: Validate AI-native state and workflow safety
        run: python scripts/validate_ai_native_repo.py

      - name: Validate YAML syntax
        shell: bash
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "valid yaml: #{f}" }' \
            .github/dependabot.yml .github/workflows/*.yml

      - name: Reject trailing whitespace in machine/code files
        shell: bash
        run: |
          if git grep -nE '[[:blank:]]+$' -- '*.py' '*.json' '*.yml' '*.yaml'; then
            echo 'Trailing whitespace found in machine/code files.' >&2
            exit 1
          fi

      - name: Show repository integrity success
        run: echo 'Repository integrity, state references, workflow pinning, JSON, and YAML checks passed.'
