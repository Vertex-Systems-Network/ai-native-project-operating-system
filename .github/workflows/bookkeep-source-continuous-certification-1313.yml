name: ANPOS 1.3.13 Source CI Bookkeeping Alt

on:
  push:
    branches:
      - ops/bookkeep-source-ci-1313-alt

permissions:
  contents: write

concurrency:
  group: anpos-1313-source-ci-bookkeeping-alt
  cancel-in-progress: false

jobs:
  bookkeep:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout bookkeeping branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply pending ANPOS 1.3.13 bookkeeping
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/apply_protocol_1313.py ]; then
            python scripts/apply_protocol_1313.py
            git diff --check
            git config user.name 'ANPOS Protocol Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add -A
            git commit -m 'Finalize ANPOS 1.3.13 persistent source certification bookkeeping'
            git push origin HEAD:ops/bookkeep-source-ci-1313-alt
          else
            echo 'ANPOS 1.3.13 bookkeeping already applied; no mutation required.'
          fi
