name: ANPOS 1.2.1 Cleanup Certification

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore canonical inert tree for validation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/anpos-cleanup-certification.yml
          test ! -d .github/workflows || test -z "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print -quit)"
          test ! -f .github/dependabot.yml
          test ! -f FINAL-CORE.md
          test -f .gitignore

      - name: Install ANPOS validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-anpos.txt

      - name: Compile ANPOS scripts and tests
        run: python -m compileall -q scripts tests

      - name: Run control-plane unit and conformance tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run full ANPOS repository validator
        run: python scripts/validate_ai_native_repo.py

      - name: Verify cleanup and protocol metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path('config/protocol/version.json').read_text())
          migrations = json.loads(Path('config/protocol/migrations.json').read_text())
          instance = json.loads(Path('config/protocol/instance.json').read_text())
          assert version['version'] == '1.2.1'
          assert version['last_protocol_migration'] == 'ANPOS-1.2.0-to-1.2.1'
          assert migrations['current_protocol_version'] == '1.2.1'
          assert any(m.get('id') == 'ANPOS-1.2.0-to-1.2.1' and m.get('status') == 'applied' for m in migrations['applied_migrations'])
          assert instance['instance_status'] == 'template_source'
          assert instance['source_protocol_version'] == '1.2.1'
          assert instance['bootstrap_completed'] is False
          assert not Path('FINAL-CORE.md').exists()
          ignore = Path('.gitignore').read_text()
          for marker in ['__pycache__/', '.env', '*.tmp', '*.bak']:
              assert marker in ignore
          print('ANPOS 1.2.1 cleanup metadata and hygiene verified.')
          PY

      - name: Certification result
        run: echo 'ANPOS 1.2.1 cleanup certification passed.'
