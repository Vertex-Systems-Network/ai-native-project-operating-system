name: ANPOS Temporary Vercel Sandbox Lock

on:
  push:
    branches:
      - feat/vercel-sandbox-gateway
    paths:
      - commercial-service/package.json
      - .github/workflows/temp-vercel-sandbox-lock.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: commercial-service/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.19.1
      - name: Generate exact package lock
        working-directory: commercial-service
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify sandbox dependency is locked
        working-directory: commercial-service
        run: |
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/@vercel/sandbox']?.version!=='3.5.0') process.exit(1)"
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commercial-service/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "Lock Vercel Sandbox dependency"
            git push origin HEAD:feat/vercel-sandbox-gateway
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-sandbox-package-lock
          path: commercial-service/package-lock.json
          if-no-files-found: error
          retention-days: 1
