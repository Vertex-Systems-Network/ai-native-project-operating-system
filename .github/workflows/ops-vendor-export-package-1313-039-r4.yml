name: ANPOS 1.3.13 Commercial 0.3.9 Vendor Export Package Refresh R4

on:
  push:
    branches:
      - ops/vendor-export-package-1313-039-r4

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 21039a3f2d1acc94d2921fd0dc4e4471562c04b4
          fetch-depth: 0
          persist-credentials: false

      - name: Assert canonical revision and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "21039a3f2d1acc94d2921fd0dc4e4471562c04b4"
          test "$(git rev-parse 'HEAD^{tree}')" = "902628c08eed30051d9feb12d3c1091515ea26ff"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Export certified vendor repositories
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/anpos-vendor-1313-039-r4"
          rm -rf "$root"
          mkdir -p "$root"
          python scripts/export_vendor_repositories.py --output "$root"

      - name: Verify exact service and template handoffs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/anpos-vendor-1313-039-r4"
          python scripts/verify_vendor_handoff.py \
            --repository "$root/anpos-commercial-service" \
            --expected-mode service \
            --expected-source-revision 21039a3f2d1acc94d2921fd0dc4e4471562c04b4 \
            --expected-source-tree 902628c08eed30051d9feb12d3c1091515ea26ff \
            --expected-service-version 0.3.9 \
            --expected-protocol-version 1.3.13 \
            --expected-runtime-contract split-github-app-v1 \
            > "$root/service-verification-receipt.json"
          python scripts/verify_vendor_handoff.py \
            --repository "$root/anpos-commercial-template" \
            --expected-mode template \
            --expected-source-revision 21039a3f2d1acc94d2921fd0dc4e4471562c04b4 \
            --expected-source-tree 902628c08eed30051d9feb12d3c1091515ea26ff \
            > "$root/template-verification-receipt.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'anpos-vendor-1313-039-r4'
          service = json.loads((root / 'service-verification-receipt.json').read_text())
          template = json.loads((root / 'template-verification-receipt.json').read_text())
          assert service['ok'] is True and template['ok'] is True
          assert service['verification'] == 'exact_deterministic_vendor_export'
          assert template['verification'] == 'exact_deterministic_vendor_export'
          assert service['canonical_source_revision'] == '21039a3f2d1acc94d2921fd0dc4e4471562c04b4'
          assert template['canonical_source_revision'] == '21039a3f2d1acc94d2921fd0dc4e4471562c04b4'
          assert service['canonical_source_tree'] == '902628c08eed30051d9feb12d3c1091515ea26ff'
          assert template['canonical_source_tree'] == '902628c08eed30051d9feb12d3c1091515ea26ff'
          assert service['artifact_identity'] == {
              'service': 'anpos-commercial-service',
              'service_version': '0.3.9',
              'source_protocol_version': '1.3.13',
              'runtime_contract': 'split-github-app-v1',
          }
          print(json.dumps({'service': service, 'template': template}, sort_keys=True))
          PY

      - name: Create deterministic handoff archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/anpos-vendor-1313-039-r4"
          archive="$RUNNER_TEMP/anpos-vendor-1.3.13-0.3.9-r4.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$root" -cf - \
            anpos-commercial-service \
            anpos-commercial-template \
            service-verification-receipt.json \
            template-verification-receipt.json \
            | gzip -n > "$archive"
          sha256sum "$archive" > "$RUNNER_TEMP/anpos-vendor-1.3.13-0.3.9-r4.tar.gz.sha256"
          cat "$RUNNER_TEMP/anpos-vendor-1.3.13-0.3.9-r4.tar.gz.sha256"

      - name: Upload verified vendor handoff package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anpos-vendor-1.3.13-0.3.9-canonical-21039a3
          path: |
            ${{ runner.temp }}/anpos-vendor-1.3.13-0.3.9-r4.tar.gz
            ${{ runner.temp }}/anpos-vendor-1.3.13-0.3.9-r4.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
