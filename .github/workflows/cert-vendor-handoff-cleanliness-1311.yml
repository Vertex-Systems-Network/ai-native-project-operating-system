name: ANPOS 1.3.11 Vendor Handoff Cleanliness Certification

on:
  push:
    branches:
      - cert/vendor-handoff-cleanliness-1311

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply pending ANPOS 1.3.11 bookkeeping
        id: bookkeeping
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/apply_protocol_1311.py ]; then
            python scripts/apply_protocol_1311.py
            git diff --check
            git config user.name 'ANPOS Protocol Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add -A
            git commit -m 'Finalize ANPOS 1.3.11 vendor handoff cleanliness bookkeeping'
            git push origin HEAD:cert/vendor-handoff-cleanliness-1311
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install validation dependency
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Compile Python sources and tests
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: python -m compileall -q scripts tests

      - name: Hide temporary certification workflow from source-inert checks
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: rm .github/workflows/cert-vendor-handoff-cleanliness-1311.yml

      - name: Run all Python unit and conformance tests
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run all source commercial vendor Marketplace operator and deployment validators
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: |
          set -euo pipefail
          python scripts/validate_ai_native_repo.py
          python scripts/validate_commercial_licensing.py
          python scripts/validate_commercial_service.py
          python scripts/validate_vendor_repository_export.py
          python scripts/validate_commercial_launch_package.py
          python scripts/validate_marketplace_staged_launch.py
          python scripts/validate_operator_launch_bootstrap.py
          python scripts/validate_deployment_identity.py

      - name: Verify ANPOS 1.3.11 cleanliness bookkeeping
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = json.loads(Path('config/protocol/version.json').read_text())
          instance = json.loads(Path('config/protocol/instance.json').read_text())
          migrations = json.loads(Path('config/protocol/migrations.json').read_text())
          package = json.loads(Path('commercial-service/package.json').read_text())
          lock = json.loads(Path('commercial-service/package-lock.json').read_text())
          catalog = json.loads(Path('config/licensing/product-catalog.json').read_text())
          verifier = Path('scripts/verify_vendor_handoff.py').read_text()
          tests = Path('tests/test_vendor_handoff.py').read_text()
          validator = Path('scripts/validate_vendor_repository_export.py').read_text()
          readme = Path('README.md').read_text()

          assert version['version'] == '1.3.11'
          assert version['last_protocol_migration'] == 'ANPOS-1.3.10-to-1.3.11'
          assert instance['source_protocol_version'] == '1.3.11'
          assert migrations['current_protocol_version'] == '1.3.11'
          assert any(item.get('id') == 'ANPOS-1.3.10-to-1.3.11' for item in migrations['applied_migrations'])
          assert migrations['migration_record_template']['id'] == 'ANPOS-1.3.11-to-NEXT'
          assert package['version'] == '0.3.4'
          assert package['anpos']['source_protocol_version'] == '1.3.11'
          assert package['anpos']['runtime_contract'] == 'split-github-app-v1'
          assert lock['version'] == '0.3.4'
          assert lock['packages']['']['version'] == '0.3.4'
          assert [plan['id'] for plan in catalog['plans']] == ['developer', 'pro', 'team', 'enterprise']
          assert '**Current protocol:** `1.3.11`' in readme
          assert '## Ignored-file vendor checkout hardening in 1.3.11' in readme
          assert '"--untracked-files=all"' in verifier
          assert '"--ignored=matching"' in verifier
          assert 'ignored files' in verifier
          assert 'test_ignored_untracked_file_is_rejected_in_git_checkout' in tests
          assert '"--ignored=matching"' in validator
          assert not Path('scripts/apply_protocol_1311.py').exists()
          PY

      - name: Restore temporary workflow and verify clean tree before export
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: |
          git checkout -- .github/workflows/cert-vendor-handoff-cleanliness-1311.yml
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Verify deterministic exports and exact vendor handoff receipts
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/export-a" "$RUNNER_TEMP/export-b"
          python scripts/export_vendor_repositories.py --output "$RUNNER_TEMP/export-a"
          python scripts/export_vendor_repositories.py --output "$RUNNER_TEMP/export-b"
          diff -qr "$RUNNER_TEMP/export-a/anpos-commercial-service" "$RUNNER_TEMP/export-b/anpos-commercial-service"
          diff -qr "$RUNNER_TEMP/export-a/anpos-commercial-template" "$RUNNER_TEMP/export-b/anpos-commercial-template"

          revision="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          python scripts/verify_vendor_handoff.py \
            --repository "$RUNNER_TEMP/export-a/anpos-commercial-service" \
            --expected-mode service \
            --expected-source-revision "$revision" \
            --expected-source-tree "$tree" \
            --expected-service-version 0.3.4 \
            --expected-protocol-version 1.3.11 \
            --expected-runtime-contract split-github-app-v1 \
            > "$RUNNER_TEMP/service-receipt.json"
          python scripts/verify_vendor_handoff.py \
            --repository "$RUNNER_TEMP/export-a/anpos-commercial-template" \
            --expected-mode template \
            --expected-source-revision "$revision" \
            --expected-source-tree "$tree" \
            > "$RUNNER_TEMP/template-receipt.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          service = json.loads((root / 'service-receipt.json').read_text())
          template = json.loads((root / 'template-receipt.json').read_text())
          assert service['ok'] is True and service['verification'] == 'exact_deterministic_vendor_export'
          assert template['ok'] is True and template['verification'] == 'exact_deterministic_vendor_export'
          assert service['artifact_identity'] == {
              'service': 'anpos-commercial-service',
              'service_version': '0.3.4',
              'source_protocol_version': '1.3.11',
              'runtime_contract': 'split-github-app-v1',
          }
          assert template['artifact_identity'] is None
          assert len(service['manifest_sha256']) == 64 and len(service['content_set_sha256']) == 64
          assert len(template['manifest_sha256']) == 64 and len(template['content_set_sha256']) == 64
          PY

      - name: Set up Node 22
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: commercial-service/package-lock.json

      - name: Pin npm 11.19.1 and install locked dependencies
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        working-directory: commercial-service
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1 --ignore-scripts
          test "$(npm --version)" = "11.19.1"
          node -e "if (!process.version.startsWith('v22.')) process.exit(1)"
          npm ci
          npm audit --audit-level=low

      - name: Certify commercial service
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        working-directory: commercial-service
        run: npm run certify

      - name: Restore expected Next build mutations and verify tracked tree clean
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev '^(commercial-service/tsconfig.json|commercial-service/next-env.d.ts)$' || true)"
          test -z "$unexpected"
          git checkout -- commercial-service/tsconfig.json commercial-service/next-env.d.ts
          test -z "$(git status --porcelain --untracked-files=no)"
