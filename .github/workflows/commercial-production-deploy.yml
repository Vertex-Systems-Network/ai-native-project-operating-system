name: ANPOS Guarded Commercial Production Deploy

on:
  push:
    branches:
      - 'ops/deploy-commercial-*'

permissions:
  contents: read

concurrency:
  group: anpos-commercial-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.repository == 'Vertex-Systems-Network/ai-native-project-operating-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: team_iCcbZCZb9Swe59vWrh9iaddM
      VERCEL_PROJECT_ID: prj_zsV5QWRGFAe7TP7wBzrkWcSDcG0w
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify canonical source and credential
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN secret is not configured for this repository" >&2
            exit 2
          fi
          git rev-parse HEAD

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Export and verify exact commercial service
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/vendor-handoff"
          python scripts/export_vendor_repositories.py --output "$out"

          revision="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          service_version="$(python -c "import json; print(json.load(open('commercial-service/package.json'))['version'])")"
          protocol_version="$(python -c "import json; print(json.load(open('config/protocol/version.json'))['version'])")"
          runtime_contract="$(python -c "import json; print(json.load(open('commercial-service/package.json'))['anpos']['runtime_contract'])")"

          python scripts/verify_vendor_handoff.py             --repository "$out/anpos-commercial-service"             --expected-mode service             --expected-source-revision "$revision"             --expected-source-tree "$tree"             --expected-service-version "$service_version"             --expected-protocol-version "$protocol_version"             --expected-runtime-contract "$runtime_contract"             > "$out/service-receipt.json"

          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads((Path(__import__("os").environ["RUNNER_TEMP"]) / "vendor-handoff" / "service-receipt.json").read_text())
          assert receipt["ok"] is True
          assert receipt["target_repository_revision"] is None
          PY

      - name: Bootstrap internal ANPOS commercial secrets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { generateKeyPairSync, randomBytes } = require("node:crypto");

          const token = process.env.VERCEL_TOKEN;
          const projectId = process.env.VERCEL_PROJECT_ID;
          const teamId = process.env.VERCEL_ORG_ID;
          if (!token || !projectId || !teamId) throw new Error("Missing Vercel deployment context");

          const { privateKey } = generateKeyPairSync("ed25519");
          const entitlementPrivateKey = privateKey.export({ format: "pem", type: "pkcs8" }).toString();
          const keyId = `anpos-entitlement-${new Date().toISOString().slice(0,10)}-${randomBytes(8).toString("hex")}`;
          const operatorToken = randomBytes(48).toString("base64url");

          const body = [
            {
              key: "ANPOS_ENTITLEMENT_PRIVATE_KEY",
              value: entitlementPrivateKey,
              type: "sensitive",
              target: ["production"],
              comment: "Generated by guarded ANPOS production bootstrap"
            },
            {
              key: "ANPOS_ENTITLEMENT_KEY_ID",
              value: keyId,
              type: "sensitive",
              target: ["production"],
              comment: "Generated by guarded ANPOS production bootstrap"
            },
            {
              key: "ANPOS_OPERATOR_TOKEN",
              value: operatorToken,
              type: "sensitive",
              target: ["production"],
              comment: "Generated by guarded ANPOS production bootstrap"
            }
          ];

          const url = `https://api.vercel.com/v10/projects/${encodeURIComponent(projectId)}/env?teamId=${encodeURIComponent(teamId)}&upsert=true`;
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
          });
          if (!response.ok) {
            const text = await response.text();
            throw new Error(`Vercel env bootstrap failed: ${response.status} ${text.slice(0,500)}`);
          }
          const result = await response.json();
          const failed = Array.isArray(result?.failed) ? result.failed.length : 0;
          if (failed) throw new Error(`Vercel env bootstrap reported ${failed} failed records`);
          console.log("Internal ANPOS production secrets configured.");
          NODE

      - name: Deploy exact verified service to Vercel production
        working-directory: ${{ runner.temp }}/vendor-handoff/anpos-commercial-service
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 deploy --prod --yes --force --token "$VERCEL_TOKEN"
