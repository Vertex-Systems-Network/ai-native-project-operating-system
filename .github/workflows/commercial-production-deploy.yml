name: ANPOS Guarded Commercial Production Deploy

on:
  push:
    branches:
      - 'ops/deploy-commercial-*'

permissions:
  contents: read

concurrency:
  group: anpos-commercial-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.repository == 'Vertex-Systems-Network/ai-native-project-operating-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: team_iCcbZCZb9Swe59vWrh9iaddM
      VERCEL_PROJECT_ID: prj_zsV5QWRGFAe7TP7wBzrkWcSDcG0w
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify canonical source and credential
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN secret is not configured for this repository" >&2
            exit 2
          fi
          git rev-parse HEAD

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Export and verify exact commercial service
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/vendor-handoff"
          python scripts/export_vendor_repositories.py --output "$out"

          revision="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          service_version="$(python -c "import json; print(json.load(open('commercial-service/package.json'))['version'])")"
          protocol_version="$(python -c "import json; print(json.load(open('config/protocol/version.json'))['version'])")"
          runtime_contract="$(python -c "import json; print(json.load(open('commercial-service/package.json'))['anpos']['runtime_contract'])")"

          python scripts/verify_vendor_handoff.py             --repository "$out/anpos-commercial-service"             --expected-mode service             --expected-source-revision "$revision"             --expected-source-tree "$tree"             --expected-service-version "$service_version"             --expected-protocol-version "$protocol_version"             --expected-runtime-contract "$runtime_contract"             > "$out/service-receipt.json"

          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads((Path(__import__("os").environ["RUNNER_TEMP"]) / "vendor-handoff" / "service-receipt.json").read_text())
          assert receipt["ok"] is True
          assert receipt["target_repository_revision"] is None
          PY

      - name: Remove temporary Repository Supervisor read grant
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/vercel-envs.json"
          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" \
            > "$response"

          python - "$response" "$RUNNER_TEMP/vercel-env-ids.txt" <<'PY'
          import json, sys
          from pathlib import Path
          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          wanted = {
              "ANPOS_INTERNAL_SUPERVISOR_READ_TEST_LOGIN",
              "ANPOS_INTERNAL_SUPERVISOR_READ_TEST_EXPIRES_AT",
          }
          payload = json.loads(source.read_text())
          envs = payload.get("envs", []) if isinstance(payload, dict) else []
          ids = [str(item["id"]) for item in envs if item.get("key") in wanted and item.get("id")]
          output.write_text("\n".join(ids))
          print(f"Temporary grant env records found: {len(ids)}")
          PY

          while IFS= read -r env_id; do
            [ -n "$env_id" ] || continue
            curl --silent --show-error --fail-with-body \
              --request DELETE \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$env_id?teamId=$VERCEL_ORG_ID" \
              >/dev/null
          done < "$RUNNER_TEMP/vercel-env-ids.txt"

      - name: Deploy exact verified service to Vercel production
        working-directory: ${{ runner.temp }}/vendor-handoff/anpos-commercial-service
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 deploy --prod --yes --force --token "$VERCEL_TOKEN"
