name: ANPOS Guarded Commercial Production Deploy

on:
  push:
    branches:
      - 'ops/deploy-commercial-*'

permissions:
  contents: read

concurrency:
  group: anpos-commercial-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.repository == 'Vertex-Systems-Network/ai-native-project-operating-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: team_iCcbZCZb9Swe59vWrh9iaddM
      VERCEL_PROJECT_ID: prj_zsV5QWRGFAe7TP7wBzrkWcSDcG0w
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify canonical source and credential
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN secret is not configured for this repository" >&2
            exit 2
          fi
          git rev-parse HEAD

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Export and verify exact commercial service
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/vendor-handoff"
          python scripts/export_vendor_repositories.py --output "$out"

          revision="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          service_version="$(python -c "import json; print(json.load(open('commercial-service/package.json'))['version'])")"
          protocol_version="$(python -c "import json; print(json.load(open('config/protocol/version.json'))['version'])")"
          runtime_contract="$(python -c "import json; print(json.load(open('commercial-service/package.json'))['anpos']['runtime_contract'])")"

          python scripts/verify_vendor_handoff.py             --repository "$out/anpos-commercial-service"             --expected-mode service             --expected-source-revision "$revision"             --expected-source-tree "$tree"             --expected-service-version "$service_version"             --expected-protocol-version "$protocol_version"             --expected-runtime-contract "$runtime_contract"             > "$out/service-receipt.json"

          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads((Path(__import__("os").environ["RUNNER_TEMP"]) / "vendor-handoff" / "service-receipt.json").read_text())
          assert receipt["ok"] is True
          assert receipt["target_repository_revision"] is None
          PY

      - name: Remove temporary Repository Supervisor read grant
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/vercel-envs.json"
          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" \
            > "$response"

          python - "$response" "$RUNNER_TEMP/vercel-env-ids.txt" <<'PY'
          import json, sys
          from pathlib import Path
          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          wanted = {
              "ANPOS_INTERNAL_SUPERVISOR_READ_TEST_LOGIN",
              "ANPOS_INTERNAL_SUPERVISOR_READ_TEST_EXPIRES_AT",
          }
          payload = json.loads(source.read_text())
          envs = payload.get("envs", []) if isinstance(payload, dict) else []
          matches = [item for item in envs if item.get("key") in wanted and item.get("id")]
          rows = []
          for item in matches:
              custom_ids = item.get("customEnvironmentIds") or []
              if not isinstance(custom_ids, list):
                  custom_ids = []
              rows.append(str(item["id"]) + "\t" + ",".join(str(x) for x in custom_ids))
              safe = {
                  "id": item.get("id"),
                  "key": item.get("key"),
                  "type": item.get("type"),
                  "target": item.get("target"),
                  "gitBranch": item.get("gitBranch"),
                  "customEnvironmentIds": custom_ids,
              }
              print("Temporary grant env metadata:", json.dumps(safe, sort_keys=True))
          output.write_text("\n".join(rows))
          counts = {key: sum(1 for item in matches if item.get("key") == key) for key in sorted(wanted)}
          print("Temporary grant env record counts:", counts)
          PY

          while IFS=

          shared_response="$RUNNER_TEMP/vercel-shared-envs.json"
          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/env?teamId=$VERCEL_ORG_ID&projectId=$VERCEL_PROJECT_ID&search=ANPOS_INTERNAL_SUPERVISOR_READ_TEST" \
            > "$shared_response"

          python - "$shared_response" "$RUNNER_TEMP/vercel-shared-env-ids.txt" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text())
          wanted = {
              "ANPOS_INTERNAL_SUPERVISOR_READ_TEST_LOGIN",
              "ANPOS_INTERNAL_SUPERVISOR_READ_TEST_EXPIRES_AT",
          }
          candidates = []
          if isinstance(payload, list):
              candidates = payload
          elif isinstance(payload, dict):
              for key in ("envs", "data", "results"):
                  value = payload.get(key)
                  if isinstance(value, list):
                      candidates = value
                      break
          matches = [item for item in candidates if isinstance(item, dict) and item.get("key") in wanted and item.get("id")]
          Path(sys.argv[2]).write_text("\n".join(str(item["id"]) for item in matches))
          counts = {key: sum(1 for item in matches if item.get("key") == key) for key in sorted(wanted)}
          print("Shared temporary grant env record counts:", counts)
          PY

          while IFS= read -r env_id; do
            [ -n "$env_id" ] || continue
            curl --silent --show-error --fail-with-body \
              --request PATCH \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v1/env/$env_id/unlink/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
              >/dev/null
          done < "$RUNNER_TEMP/vercel-shared-env-ids.txt"

      - name: Deploy exact verified service to Vercel production
        working-directory: ${{ runner.temp }}/vendor-handoff/anpos-commercial-service
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 deploy --prod --yes --force --token "$VERCEL_TOKEN"
\t' read -r env_id custom_ids; do
            [ -n "$env_id" ] || continue
            if [ -n "${custom_ids:-}" ]; then
              IFS=',' read -ra ids <<< "$custom_ids"
              for custom_id in "${ids[@]}"; do
                [ -n "$custom_id" ] || continue
                curl --silent --show-error --fail-with-body \
                  --request DELETE \
                  --header "Authorization: Bearer $VERCEL_TOKEN" \
                  "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$env_id?teamId=$VERCEL_ORG_ID&customEnvironmentId=$custom_id" \
                  >/dev/null
              done
            fi
            curl --silent --show-error --fail-with-body \
              --request DELETE \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$env_id?teamId=$VERCEL_ORG_ID" \
              >/dev/null
          done < "$RUNNER_TEMP/vercel-env-ids.txt"

          shared_response="$RUNNER_TEMP/vercel-shared-envs.json"
          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/env?teamId=$VERCEL_ORG_ID&projectId=$VERCEL_PROJECT_ID&search=ANPOS_INTERNAL_SUPERVISOR_READ_TEST" \
            > "$shared_response"

          python - "$shared_response" "$RUNNER_TEMP/vercel-shared-env-ids.txt" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text())
          wanted = {
              "ANPOS_INTERNAL_SUPERVISOR_READ_TEST_LOGIN",
              "ANPOS_INTERNAL_SUPERVISOR_READ_TEST_EXPIRES_AT",
          }
          candidates = []
          if isinstance(payload, list):
              candidates = payload
          elif isinstance(payload, dict):
              for key in ("envs", "data", "results"):
                  value = payload.get(key)
                  if isinstance(value, list):
                      candidates = value
                      break
          matches = [item for item in candidates if isinstance(item, dict) and item.get("key") in wanted and item.get("id")]
          Path(sys.argv[2]).write_text("\n".join(str(item["id"]) for item in matches))
          counts = {key: sum(1 for item in matches if item.get("key") == key) for key in sorted(wanted)}
          print("Shared temporary grant env record counts:", counts)
          PY

          while IFS= read -r env_id; do
            [ -n "$env_id" ] || continue
            curl --silent --show-error --fail-with-body \
              --request PATCH \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v1/env/$env_id/unlink/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
              >/dev/null
          done < "$RUNNER_TEMP/vercel-shared-env-ids.txt"

      - name: Deploy exact verified service to Vercel production
        working-directory: ${{ runner.temp }}/vendor-handoff/anpos-commercial-service
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 deploy --prod --yes --force --token "$VERCEL_TOKEN"
