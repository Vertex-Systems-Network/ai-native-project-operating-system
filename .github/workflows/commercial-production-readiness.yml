name: ANPOS Guarded Commercial Production Readiness Audit

on:
  push:
    branches:
      - 'ops/verify-commercial-*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: anpos-commercial-production-readiness
  cancel-in-progress: false

jobs:
  verify-production:
    if: github.repository == 'Vertex-Systems-Network/ai-native-project-operating-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCTION_DEPLOYMENT: https://anpos-commercial-service.vercel.app

    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify canonical identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          echo "CANONICAL_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "EXPECTED_SERVICE_VERSION=$(python -c "import json; print(json.load(open('commercial-service/package.json'))['version'])")" >> "$GITHUB_ENV"
          echo "EXPECTED_PROTOCOL_VERSION=$(python -c "import json; print(json.load(open('config/protocol/version.json'))['version'])")" >> "$GITHUB_ENV"

      - name: Request short-lived GitHub Actions OIDC token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          token_json="$(curl --silent --show-error --fail-with-body \
            --max-time 15 \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          oidc_token="$(python -c 'import json,sys; token=json.load(sys.stdin).get("value"); assert isinstance(token,str) and token.count(".")==2; print(token)' <<<"$token_json")"
          echo "::add-mask::$oidc_token"
          echo "ANPOS_GITHUB_OIDC_TOKEN=$oidc_token" >> "$GITHUB_ENV"

      - name: Probe protected production routes with trusted OIDC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readiness"

          probe() {
            path="$1"
            name="$2"
            body="$RUNNER_TEMP/readiness/$name.body"
            headers="$RUNNER_TEMP/readiness/$name.headers"

            set +e
            status="$(curl --silent --show-error \
              --max-time 20 \
              --output "$body" \
              --dump-header "$headers" \
              --write-out '%{http_code}' \
              --header "x-vercel-trusted-oidc-idp-token: $ANPOS_GITHUB_OIDC_TOKEN" \
              "$PRODUCTION_DEPLOYMENT$path")"
            rc=$?
            set -e

            printf '%s\n' "$rc" > "$RUNNER_TEMP/readiness/$name.rc"
            printf '%s\n' "$status" > "$RUNNER_TEMP/readiness/$name.status"
          }

          probe "/api/version" "version"
          probe "/api/ready/community" "community"
          probe "/api/ready/mcp" "mcp"
          probe "/api/ready/sandbox" "sandbox"
          probe "/api/ready" "full"

      - name: Normalize and validate readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "readiness"

          def load(name):
              rc = int((root / f"{name}.rc").read_text().strip())
              status_text = (root / f"{name}.status").read_text().strip()
              if not status_text.isdigit():
                  raise SystemExit(f"{name}: invalid HTTP status output {status_text!r}")
              status = int(status_text)
              body = (root / f"{name}.body").read_text(errors="replace").strip()

              payload = None
              if body:
                  try:
                      payload = json.loads(body)
                  except Exception:
                      payload = None

              print(f"READINESS_{name.upper()}_CURL_RC={rc}")
              print(f"READINESS_{name.upper()}_HTTP_STATUS={status}")
              if payload is not None:
                  print(f"READINESS_{name.upper()}_JSON={json.dumps(payload, sort_keys=True, separators=(',', ':'))}")
              else:
                  print(f"READINESS_{name.upper()}_BODY_CLASS=non_json_or_empty")

              return {"curl_rc": rc, "http_status": status, "payload": payload}

          version = load("version")
          if version["curl_rc"] != 0 or version["http_status"] != 200 or not isinstance(version["payload"], dict):
              raise SystemExit("version: protected production request did not return JSON HTTP 200")
          payload = version["payload"]
          expected_service = os.environ["EXPECTED_SERVICE_VERSION"]
          expected_protocol = os.environ["EXPECTED_PROTOCOL_VERSION"]
          if payload.get("ok") is not True:
              raise SystemExit("version: ok must be true")
          if payload.get("service") != "anpos-commercial-service":
              raise SystemExit("version: unexpected service")
          if payload.get("service_version") != expected_service:
              raise SystemExit("version: service version mismatch")
          if payload.get("source_protocol_version") != expected_protocol:
              raise SystemExit("version: protocol version mismatch")
          if payload.get("runtime_contract") != "split-github-app-v1":
              raise SystemExit("version: runtime contract mismatch")

          results = {
              "community": load("community"),
              "mcp": load("mcp"),
              "sandbox": load("sandbox"),
              "full": load("full"),
          }

          for name, result in results.items():
              if result["curl_rc"] != 0:
                  raise SystemExit(f"{name}: transport failure")
              if result["http_status"] not in {200, 503}:
                  raise SystemExit(f"{name}: unexpected HTTP status {result['http_status']}; trusted OIDC bypass may not be configured")
              if not isinstance(result["payload"], dict):
                  raise SystemExit(f"{name}: expected JSON readiness payload")

          summary = {
              "canonical_source_sha": os.environ["CANONICAL_SOURCE_SHA"],
              "service_version": expected_service,
              "protocol_version": expected_protocol,
              "runtime_contract": "split-github-app-v1",
              **results,
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print("READINESS_SUMMARY=" + json.dumps(summary, sort_keys=True, separators=(',', ':')))
          PY

      - name: Upload secret-free readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anpos-commercial-readiness-${{ env.CANONICAL_SOURCE_SHA }}
          path: ${{ runner.temp }}/readiness/summary.json
          if-no-files-found: error
          retention-days: 30
