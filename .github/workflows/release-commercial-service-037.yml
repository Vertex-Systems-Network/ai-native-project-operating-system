name: One-shot commercial service 0.3.7 bump

on:
  push:
    branches:
      - release/commercial-service-0.3.7

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/commercial-service-0.3.7
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'

      - name: Pin npm and generate synchronized package identity
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
          npm version 0.3.7 --no-git-tag-version --prefix commercial-service
          python - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path('commercial-service/package.json').read_text())
          lock = json.loads(Path('commercial-service/package-lock.json').read_text())
          assert package['version'] == '0.3.7'
          assert package['anpos']['source_protocol_version'] == '1.3.13'
          assert package['anpos']['runtime_contract'] == 'split-github-app-v1'
          assert lock['version'] == '0.3.7'
          assert lock['packages']['']['version'] == '0.3.7'
          PY

      - name: Remove one-shot workflow and push generated release commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/release-commercial-service-037.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add commercial-service/package.json commercial-service/package-lock.json
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/release-commercial-service-037.yml' 'commercial-service/package-lock.json' 'commercial-service/package.json' | sort)"
          test "$changed" = "$expected"
          git commit -m 'Release commercial service 0.3.7'
          git push origin HEAD:release/commercial-service-0.3.7
