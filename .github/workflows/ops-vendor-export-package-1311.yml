name: ANPOS 1.3.11 Vendor Export Package

on:
  push:
    branches:
      - ops/vendor-export-package-1311

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0d6cf94388be7f097c906d527f1f7d023f113d21
          fetch-depth: 0
          persist-credentials: false

      - name: Assert canonical revision and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0d6cf94388be7f097c906d527f1f7d023f113d21"
          test "$(git rev-parse 'HEAD^{tree}')" = "8c941247413ae1bcdad189567e16f8f1b619cb50"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Export certified vendor repositories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/anpos-vendor-1311"
          mkdir -p "$RUNNER_TEMP/anpos-vendor-1311"
          python scripts/export_vendor_repositories.py --output "$RUNNER_TEMP/anpos-vendor-1311"

      - name: Verify exact service and template handoffs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/anpos-vendor-1311"
          python scripts/verify_vendor_handoff.py \
            --repository "$root/anpos-commercial-service" \
            --expected-mode service \
            --expected-source-revision 0d6cf94388be7f097c906d527f1f7d023f113d21 \
            --expected-source-tree 8c941247413ae1bcdad189567e16f8f1b619cb50 \
            --expected-service-version 0.3.4 \
            --expected-protocol-version 1.3.11 \
            --expected-runtime-contract split-github-app-v1 \
            > "$root/service-verification-receipt.json"
          python scripts/verify_vendor_handoff.py \
            --repository "$root/anpos-commercial-template" \
            --expected-mode template \
            --expected-source-revision 0d6cf94388be7f097c906d527f1f7d023f113d21 \
            --expected-source-tree 8c941247413ae1bcdad189567e16f8f1b619cb50 \
            > "$root/template-verification-receipt.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'anpos-vendor-1311'
          service = json.loads((root / 'service-verification-receipt.json').read_text())
          template = json.loads((root / 'template-verification-receipt.json').read_text())
          assert service['ok'] is True
          assert template['ok'] is True
          assert service['canonical_source_revision'] == '0d6cf94388be7f097c906d527f1f7d023f113d21'
          assert template['canonical_source_revision'] == '0d6cf94388be7f097c906d527f1f7d023f113d21'
          assert service['canonical_source_tree'] == '8c941247413ae1bcdad189567e16f8f1b619cb50'
          assert template['canonical_source_tree'] == '8c941247413ae1bcdad189567e16f8f1b619cb50'
          assert service['artifact_identity'] == {
              'service': 'anpos-commercial-service',
              'service_version': '0.3.4',
              'source_protocol_version': '1.3.11',
              'runtime_contract': 'split-github-app-v1',
          }
          assert template['artifact_identity'] is None
          PY

      - name: Create deterministic handoff archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/anpos-vendor-1311"
          archive="$RUNNER_TEMP/anpos-vendor-1.3.11-0.3.4.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$root" -cf - \
            anpos-commercial-service \
            anpos-commercial-template \
            service-verification-receipt.json \
            template-verification-receipt.json \
            | gzip -n > "$archive"
          sha256sum "$archive" > "$RUNNER_TEMP/anpos-vendor-1.3.11-0.3.4.tar.gz.sha256"
          cat "$RUNNER_TEMP/anpos-vendor-1.3.11-0.3.4.tar.gz.sha256"

      - name: Upload verified vendor handoff package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anpos-vendor-1.3.11-0.3.4
          path: |
            ${{ runner.temp }}/anpos-vendor-1.3.11-0.3.4.tar.gz
            ${{ runner.temp }}/anpos-vendor-1.3.11-0.3.4.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
