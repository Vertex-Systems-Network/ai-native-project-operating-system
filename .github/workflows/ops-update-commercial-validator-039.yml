name: Update commercial validator for premium API contract

on:
  push:
    branches:
      - commercial/pro-premium-distribution

permissions:
  contents: write

jobs:
  patch-validator:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: commercial/pro-premium-distribution
          fetch-depth: 0

      - name: Patch one explicit API contract version assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_commercial_service.py')
          text = path.read_text()
          old = 'if api_contract.get("schema_version") != 5:\n        fail("commercial service API contract must be schema_version 5")'
          new = 'if api_contract.get("schema_version") != 6:\n        fail("commercial service API contract must be schema_version 6")'
          if new in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit('expected schema-version assertion not found exactly once')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit validator only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/validate_commercial_service.py; then
            echo 'validator already synchronized'
            exit 0
          fi
          unexpected="$(git diff --name-only | grep -v '^scripts/validate_commercial_service.py$' || true)"
          test -z "$unexpected"
          git config user.name 'ANPOS Operations'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/validate_commercial_service.py
          git commit -m 'Accept premium API contract schema 6'
          git push origin HEAD:commercial/pro-premium-distribution
