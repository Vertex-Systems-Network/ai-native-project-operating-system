name: ANPOS 1.3.13 Commercial 0.3.7 Operator Bootstrap Draft

on:
  push:
    branches:
      - ops/operator-bootstrap-draft-1313-037

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1c3d2165c3fdee615e9f3043dcef0f8c4c70ee0d
          fetch-depth: 0
          persist-credentials: false

      - name: Assert canonical revision and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1c3d2165c3fdee615e9f3043dcef0f8c4c70ee0d"
          test "$(git rev-parse 'HEAD^{tree}')" = "db302deb9681445129cb7c18d6d12ee348f33685"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Validate canonical operator bootstrap tooling
        run: python scripts/validate_operator_launch_bootstrap.py

      - name: Render secret-safe operator bootstrap draft
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/anpos-operator-bootstrap-draft-1.3.13-0.3.7.json"
          python scripts/render_operator_launch_bootstrap.py \
            --organization Vertex-Systems-Network \
            --service-base-url https://anpos-commercial-service.vercel.app \
            --homepage-url https://github.com/Vertex-Systems-Network/ai-native-project-operating-system \
            > "$out"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'anpos-operator-bootstrap-draft-1.3.13-0.3.7.json'
          data = json.loads(p.read_text())
          assert data['schema_version'] == 5
          assert data['launch_authorized'] is False
          assert data['artifact_identity'] == {
              'service': 'anpos-commercial-service',
              'service_version': '0.3.7',
              'source_protocol_version': '1.3.13',
              'runtime_contract': 'split-github-app-v1',
          }
          vendor = data['vendor_repository_handoff']
          assert vendor['canonical_source_revision'] == '1c3d2165c3fdee615e9f3043dcef0f8c4c70ee0d'
          assert vendor['canonical_source_tree'] == 'db302deb9681445129cb7c18d6d12ee348f33685'
          assert data['production_verifier_arguments'] == [
              '--require-ready',
              '--expected-service-version', '0.3.7',
              '--expected-protocol-version', '1.3.13',
          ]
          assert 'ANPOS_COMMERCIAL_RELEASE_REF' in data['service_environment_keys']
          assert any('ANPOS_COMMERCIAL_RELEASE_REF' in step for step in data['operator_sequence'])
          serialized = json.dumps(data).lower()
          for forbidden in ('-----begin private key-----', 'ghp_', 'github_pat_'):
              assert forbidden not in serialized
          PY
          printf '%s\n' \
            'This is a secret-safe DRAFT handoff generated from canonical ANPOS 1.3.13 / commercial service 0.3.7.' \
            'Organization: Vertex-Systems-Network' \
            'Service base URL: https://anpos-commercial-service.vercel.app' \
            'Homepage candidate: https://github.com/Vertex-Systems-Network/ai-native-project-operating-system' \
            '' \
            'The homepage value is a current public candidate, not a recorded product-owner approval.' \
            'ANPOS_COMMERCIAL_RELEASE_REF must be set later to the exact verified private template repository commit SHA, not main/branch/tag.' \
            'This packet does NOT create either GitHub App, does NOT create repositories, does NOT contain private keys/webhook secrets, and does NOT authorize launch.' \
            > "$RUNNER_TEMP/OPERATOR-NOTE.txt"
          sha256sum "$out" > "$RUNNER_TEMP/anpos-operator-bootstrap-draft-1.3.13-0.3.7.json.sha256"

      - name: Upload operator bootstrap draft
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anpos-operator-bootstrap-draft-1.3.13-0.3.7
          path: |
            ${{ runner.temp }}/anpos-operator-bootstrap-draft-1.3.13-0.3.7.json
            ${{ runner.temp }}/anpos-operator-bootstrap-draft-1.3.13-0.3.7.json.sha256
            ${{ runner.temp }}/OPERATOR-NOTE.txt
          if-no-files-found: error
          retention-days: 1
