name: ANPOS Guarded Commercial Database Migration

on:
  push:
    branches:
      - 'ops/migrate-commercial-*'

permissions:
  contents: read

concurrency:
  group: anpos-commercial-production-database
  cancel-in-progress: false

jobs:
  migrate-production:
    if: github.repository == 'Vertex-Systems-Network/ai-native-project-operating-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_iCcbZCZb9Swe59vWrh9iaddM
      VERCEL_PROJECT_ID: prj_zsV5QWRGFAe7TP7wBzrkWcSDcG0w
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify canonical source and Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN secret is not configured for this repository" >&2
            exit 2
          fi
          echo "CANONICAL_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Export and verify exact commercial service
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/vendor-handoff"
          rm -rf "$out"
          python scripts/export_vendor_repositories.py --output "$out"

          revision="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          service_version="$(python -c "import json; print(json.load(open('commercial-service/package.json'))['version'])")"
          protocol_version="$(python -c "import json; print(json.load(open('config/protocol/version.json'))['version'])"
          runtime_contract="$(python -c "import json; print(json.load(open('commercial-service/package.json'))['anpos']['runtime_contract'])")"

          python scripts/verify_vendor_handoff.py \
            --repository "$out/anpos-commercial-service" \
            --expected-mode service \
            --expected-source-revision "$revision" \
            --expected-source-tree "$tree" \
            --expected-service-version "$service_version" \
            --expected-protocol-version "$protocol_version" \
            --expected-runtime-contract "$runtime_contract" \
            > "$out/service-receipt.json"

          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "vendor-handoff"
          receipt = json.loads((root / "service-receipt.json").read_text())
          assert receipt["ok"] is True
          assert receipt["verification"] == "exact_deterministic_vendor_export"
          PY

          echo "SERVICE_EXPORT_DIR=$out/anpos-commercial-service" >> "$GITHUB_ENV"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Run migrations inside Vercel production build and deploy exact service
        shell: bash
        run: |
          set -euo pipefail
          cd "$SERVICE_EXPORT_DIR"
          npx --yes vercel@59.11.7 deploy \
            --prod \
            --yes \
            --force \
            --build-env "ANPOS_PRODUCTION_MIGRATE_ON_BUILD=$CANONICAL_SOURCE_SHA" \
            --token "$VERCEL_TOKEN"
