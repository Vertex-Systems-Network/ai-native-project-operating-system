name: ANPOS 1.3.8 Deployment Identity Certification

on:
  push:
    branches:
      - cert/deployment-identity-138

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply pending ANPOS 1.3.8 bookkeeping
        id: bookkeeping
        shell: bash
        run: |
          set -euo pipefail
          changed=false
          if [ -f scripts/apply_protocol_138.py ]; then
            python scripts/apply_protocol_138.py
            changed=true
          fi
          if [ -f scripts/apply_138_verifier_compat.py ]; then
            python scripts/apply_138_verifier_compat.py
            changed=true
          fi
          if [ "$changed" = true ]; then
            git diff --check
            git config user.name 'ANPOS Protocol Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add -A
            git commit -m 'Finalize ANPOS 1.3.8 deployment identity bookkeeping'
            git push origin HEAD:cert/deployment-identity-138
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install validation dependency
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Compile Python sources and tests
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: python -m compileall -q scripts tests

      - name: Hide temporary certification workflow from source-inert checks
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: rm .github/workflows/cert-deployment-identity-138.yml

      - name: Run all Python unit and conformance tests
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run source commercial vendor Marketplace operator and deployment validators
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: |
          set -euo pipefail
          python scripts/validate_ai_native_repo.py
          python scripts/validate_commercial_licensing.py
          python scripts/validate_commercial_service.py
          python scripts/validate_vendor_repository_export.py
          python scripts/validate_commercial_launch_package.py
          python scripts/validate_marketplace_staged_launch.py
          python scripts/validate_operator_launch_bootstrap.py
          python scripts/validate_deployment_identity.py

      - name: Verify ANPOS 1.3.8 deployment identity bookkeeping
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = json.loads(Path('config/protocol/version.json').read_text())
          instance = json.loads(Path('config/protocol/instance.json').read_text())
          migrations = json.loads(Path('config/protocol/migrations.json').read_text())
          package = json.loads(Path('commercial-service/package.json').read_text())
          lock = json.loads(Path('commercial-service/package-lock.json').read_text())
          contract = json.loads(Path('blueprints/commercial/service-api-contract.json').read_text())
          checklist = json.loads(Path('blueprints/commercial/production-launch-checklist.json').read_text())
          boundary = json.loads(Path('config/licensing/vendor-source-boundary.json').read_text())
          manifest = json.loads(Path('.ai/manifest.json').read_text())
          readme = Path('README.md').read_text()
          verifier = Path('scripts/verify_commercial_production.py').read_text()
          route = Path('commercial-service/app/api/version/route.ts').read_text()

          assert version['version'] == '1.3.8'
          assert version['last_protocol_migration'] == 'ANPOS-1.3.7-to-1.3.8'
          assert instance['source_protocol_version'] == '1.3.8'
          assert migrations['current_protocol_version'] == '1.3.8'
          assert any(item.get('id') == 'ANPOS-1.3.7-to-1.3.8' for item in migrations['applied_migrations'])
          assert migrations['migration_record_template']['id'] == 'ANPOS-1.3.8-to-NEXT'
          assert package['version'] == '0.3.1'
          assert package['anpos']['source_protocol_version'] == '1.3.8'
          assert package['anpos']['runtime_contract'] == 'split-github-app-v1'
          assert lock['version'] == '0.3.1'
          assert lock['packages']['']['version'] == '0.3.1'
          assert any(item.get('path') == '/version' for item in contract['endpoints'])
          assert contract['cross_cutting_rules']['deployment_identity_endpoint_required'] is True
          assert any(item.get('id') == 'deployment_identity' for item in checklist['required_gates'])
          assert checklist['launch_authorized'] is False
          assert '**Current protocol:** `1.3.8`' in readme
          assert '## Deployment identity attestation in 1.3.8' in readme
          assert '"/api/version"' in verifier
          assert '"/api/v1/keys"' in verifier
          assert '"/api/v1/entitlements/current"' in verifier
          assert '"/api/v1/reconcile"' in verifier
          assert '--expected-service-version' in verifier
          assert '--expected-protocol-version' in verifier
          assert '--require-ready passes and real Marketplace E2E evidence is recorded.' in verifier
          assert 'import packageJson from "@/package.json"' in route
          expected_vendor_only = {'scripts/validate_deployment_identity.py', 'tests/test_deployment_identity.py'}
          assert expected_vendor_only.issubset(set(boundary['vendor_only_paths']))
          role_files = set(manifest['roles']['commercial_distribution'])
          for item in ('commercial-service/app/api/version/route.ts', 'scripts/verify_commercial_production.py', 'scripts/validate_deployment_identity.py'):
              assert item in role_files
          assert not Path('scripts/apply_protocol_138.py').exists()
          assert not Path('scripts/apply_138_verifier_compat.py').exists()
          PY

      - name: Restore temporary workflow and verify clean tree before export
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        run: |
          git checkout -- .github/workflows/cert-deployment-identity-138.yml
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Verify deterministic vendor exports and deployment identity boundary
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/export-a" "$RUNNER_TEMP/export-b"
          python scripts/export_vendor_repositories.py --output "$RUNNER_TEMP/export-a"
          python scripts/export_vendor_repositories.py --output "$RUNNER_TEMP/export-b"
          diff -qr "$RUNNER_TEMP/export-a/anpos-commercial-service" "$RUNNER_TEMP/export-b/anpos-commercial-service"
          diff -qr "$RUNNER_TEMP/export-a/anpos-commercial-template" "$RUNNER_TEMP/export-b/anpos-commercial-template"
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'export-a'
          template = root / 'anpos-commercial-template'
          service = root / 'anpos-commercial-service'
          policy = json.loads(Path('config/licensing/vendor-source-boundary.json').read_text())
          for relative in policy['vendor_only_paths']:
              assert not (template / relative).exists(), relative
          for relative in ('scripts/validate_deployment_identity.py', 'tests/test_deployment_identity.py'):
              assert not (template / relative).exists(), relative
          manifest = json.loads((template / 'EXPORT-MANIFEST.json').read_text())
          assert manifest['source_scope'] == 'canonical-minus-vendor-only-paths'
          origins = {str(item['origin']) for item in manifest['files']}
          for relative in policy['vendor_only_paths']:
              assert relative not in origins
              assert not any(origin.startswith(relative.rstrip('/') + '/') for origin in origins)
          package = json.loads((service / 'package.json').read_text())
          assert package['version'] == '0.3.1'
          assert package['anpos']['source_protocol_version'] == '1.3.8'
          assert package['anpos']['runtime_contract'] == 'split-github-app-v1'
          assert (service / 'app/api/version/route.ts').is_file()
          PY

      - name: Set up Node 22
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: commercial-service/package-lock.json

      - name: Pin npm 11.19.1 and install locked dependencies
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        working-directory: commercial-service
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1 --ignore-scripts
          test "$(npm --version)" = "11.19.1"
          node -e "if (!process.version.startsWith('v22.')) process.exit(1)"
          npm ci
          npm audit --audit-level=low

      - name: Certify commercial service 0.3.1
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        working-directory: commercial-service
        run: npm run certify

      - name: Restore expected Next build mutations and verify tracked tree clean
        if: ${{ steps.bookkeeping.outputs.changed != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev '^(commercial-service/tsconfig.json|commercial-service/next-env.d.ts)$' || true)"
          test -z "$unexpected"
          git checkout -- commercial-service/tsconfig.json commercial-service/next-env.d.ts
          test -z "$(git status --porcelain --untracked-files=no)"
