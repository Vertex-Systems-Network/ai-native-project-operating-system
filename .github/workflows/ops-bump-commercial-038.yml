name: ANPOS Commercial 0.3.8 Identity Bump

on:
  push:
    branches:
      - commercial/team-admin-ui-038

permissions:
  contents: write

jobs:
  bump:
    if: github.event.head_commit.message != 'Release commercial service 0.3.8'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Team release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: commercial/team-admin-ui-038
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Pin npm 11.19.1 and bump package identity
        working-directory: commercial-service
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1 --ignore-scripts
          test "$(npm --version)" = "11.19.1"
          npm version 0.3.8 --no-git-tag-version
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== '0.3.8') process.exit(1);
          if (lock.version !== '0.3.8') process.exit(1);
          if (lock.packages[''].version !== '0.3.8') process.exit(1);
          if (pkg.anpos.source_protocol_version !== '1.3.13') process.exit(1);
          if (pkg.anpos.runtime_contract !== 'split-github-app-v1') process.exit(1);
          NODE

      - name: Commit synchronized version files
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all | grep -vE '^ M commercial-service/package(-lock)?\.json$' || true)"
          git config user.name 'ANPOS Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add commercial-service/package.json commercial-service/package-lock.json
          git diff --cached --check
          git commit -m 'Release commercial service 0.3.8'
          git push origin HEAD:commercial/team-admin-ui-038
