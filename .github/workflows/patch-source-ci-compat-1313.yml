name: ANPOS 1.3.13 Source CI Compatibility Patch

on:
  push:
    branches:
      - cert/source-continuous-certification-1313

permissions:
  contents: write

concurrency:
  group: anpos-1313-source-ci-compat-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact compatibility branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Patch source/template workflow compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          validator_path = Path('scripts/validate_ai_native_repo.py')
          validator = validator_path.read_text(encoding='utf-8')
          old_validator = '''    active = ROOT / ".github" / "workflows"
              if active.exists() and any(active.glob("*.y*ml")):
                  fail("template source: child runtime workflows must not exist in active .github/workflows")
          '''.replace('              ', '    ')
          new_validator = '''    active = ROOT / ".github" / "workflows"
              active_workflows = sorted(
                  [path.name for path in active.glob("*.yml")] +
                  [path.name for path in active.glob("*.yaml")]
              ) if active.exists() else []
              allowed_source_workflows = ["source-continuous-certification.yml"]
              if active_workflows not in ([], allowed_source_workflows):
                  fail("template source: only guarded source-continuous-certification.yml may exist in active .github/workflows")
              source_ci = active / "source-continuous-certification.yml"
              if source_ci.is_file():
                  source_ci_text = source_ci.read_text(encoding="utf-8")
                  if "github.repository == 'Vertex-Systems-Network/ai-native-project-operating-system'" not in source_ci_text:
                      fail("template source: source continuous certification workflow must be repository-guarded")
                  if "contents: write" in source_ci_text or "persist-credentials: true" in source_ci_text:
                      fail("template source: source continuous certification workflow must remain read-only")
          '''.replace('              ', '    ')
          if validator.count(old_validator) != 1:
              raise SystemExit('expected validator workflow-boundary block not found exactly once')
          validator_path.write_text(validator.replace(old_validator, new_validator), encoding='utf-8')

          test_path = Path('tests/test_control_plane.py')
          test = test_path.read_text(encoding='utf-8')
          old_test = '''    def test_source_has_only_guarded_source_certification_workflow(self):
              workflow_dir = ROOT / ".github" / "workflows"
              active = sorted(
                  [p.name for p in workflow_dir.glob("*.yml")] +
                  [p.name for p in workflow_dir.glob("*.yaml")]
              ) if workflow_dir.exists() else []
              self.assertEqual(active, ["source-continuous-certification.yml"])
              source = (workflow_dir / "source-continuous-certification.yml").read_text()
              self.assertIn(
                  "github.repository == 'Vertex-Systems-Network/ai-native-project-operating-system'",
                  source,
              )
          '''.replace('              ', '    ')
          new_test = '''    def test_source_template_has_only_optional_guarded_source_certification_workflow(self):
              instance = json.loads((ROOT / "config/protocol/instance.json").read_text())
              if instance.get("instance_status") != "template_source":
                  self.skipTest("source-template workflow invariant does not apply after child bootstrap")
              workflow_dir = ROOT / ".github" / "workflows"
              active = sorted(
                  [p.name for p in workflow_dir.glob("*.yml")] +
                  [p.name for p in workflow_dir.glob("*.yaml")]
              ) if workflow_dir.exists() else []
              self.assertIn(active, ([], ["source-continuous-certification.yml"]))
              if active:
                  source = (workflow_dir / "source-continuous-certification.yml").read_text()
                  self.assertIn(
                      "github.repository == 'Vertex-Systems-Network/ai-native-project-operating-system'",
                      source,
                  )
                  self.assertNotIn("contents: write", source)
                  self.assertNotIn("persist-credentials: true", source)
          '''.replace('              ', '    ')
          if test.count(old_test) != 1:
              raise SystemExit('expected source workflow unit-test block not found exactly once')
          test_path.write_text(test.replace(old_test, new_test), encoding='utf-8')

          Path('.github/workflows/patch-source-ci-compat-1313.yml').unlink()
          PY

          git diff --check
          git config user.name 'ANPOS Protocol Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Make source CI compatible with template and child boundaries'
          git push origin HEAD:cert/source-continuous-certification-1313
